<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
      body {
          font-family: Arial, sans-serif;
          background-color: #f0f0f0;
      }
      
      .content-wrapper {
          max-width: 500px;
          margin: 40px auto;
          padding: 20px;
          background-color: #fff;
          border: 1px solid #ddd;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      
      h1 {
          margin-top: 0;
          font-weight: bold;
          color: #333;
      }
      
      .input {
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 20px;
      }
      
      .input input:not([type="submit"]){
          width: 100%;
          height: 35px;
          margin-bottom: 20px;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 5px;
      }
      
      .input input[type="submit"] {
          width: 100%;
          height: 35px;
          background-color: #222529;
          color: #fff;
          border: none;
          border-radius: 5px;
          cursor: pointer;
      }
      
      .input input[type="submit"]:hover {
          background-color:rgb(68, 73, 80);
      }
      
      h2 {
          color: red;
          font-weight: bold;
          margin-top: 20px;
      }
      
      .google-signin {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 5px;
          background-color: #4285F4; /* Google Blue */
          color: #fff;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          text-decoration: none;
          font-weight: bold;
          width: 97%;
          text-align: center;
          transition: background-color 0.3s;
      }
      .google-signin:hover {
          background-color: #357ae8; /* Darker shade on hover */
      }
      .google-signin svg {
          margin-right: 8px;
      }
  </style>
</head>

{% include "parts/navbar.html" %}
{% load socialaccount%}
<div class="content-wrapper">
  <h1> Login </h1>
  <form method="POST" class="input">
      {% csrf_token %}
      <input type="text" placeholder="Username" name="username">
      <br>
      <div class="input-group">
        <input type="password" placeholder="password" name="password" id="password" autocomplete="off">
        <i class="fa fa-eye" id="toggle-password" aria-hidden="true"></i>
    </div>
      <br>
      <input type="submit" value='submit'>
  </form>
    <a class="google-signin" href="{% provider_login_url 'google' process='login' %}">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16"><path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/></svg>
  Join With your Google Account
  </a>
  {% if messages %}
      <h2>
          {% for message in messages %}
              {{ message }}
          {% endfor %}
      </h2>
  {% endif %}
</div>

<script>
  document.getElementById('toggle-password').addEventListener('click', function() {
      var passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
      } else {
          passwordInput.type = 'password';
      }
  });
</script>
